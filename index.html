<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastify-js/1.12.0/toastify.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Employee data management System</title>
    <link rel="stylesheet" href="style/index.css">
    <link rel="shortcut icon" href="images/favicon.jpg" type="image/x-icon">
</head>

<body>

    <header>
        <div class="two">
            <h1>Employee Salary Management</h1>
        </div>
        <div class="menu">
            <div class="nav">
                <ul>
                    <li><a href="index.html">Add Employee</a></li>
                    <li><a href="table.html">view Table</a></li>
                </ul>
            </div>
            <div class="box">
                <ul class="setting">
                    <li id="mode"><i class="fa-solid fa-moon moon"></i><i class="fa-solid fa-sun sun"
                            style="display: none;"></i></li>

                </ul>

            </div>

            <!-- <div class="box icon">
                <i class="fa-solid fa-bell"></i>
            </div>
            <div class="box icon">
                <i class="fa-solid fa-user"></i>
            </div> -->
        </div>

        <i class="fa-solid fa-bars"></i>
    </header>




    <section class="formsection">


        <div class="form">
            <form action="">
                <h1 style="text-align: center;">Add Employee</h1>

                <div class="inputbox">
                    <label for="">Employee Name</label>
                    <input type="text" placeholder="Enter name here.." maxlength="20" id="name">
                    <span class="error"></span>
                </div>

                <div class="inputbox">
                    <label for="">Phone</label>
                    <input type="number" placeholder="Enter Phone number.." id="phnumber">
                    <span class="error"></span>
                </div>
                <div class="inputbox">
                    <select name="" id="department">
                        <option value="">please select designation</option>
                        <option value="software developer">software developer</option>
                        <option value="systems analysts"> systems analysts</option>
                        <option value="network engineer">network engineer</option>
                    </select>
                    <span class="error"></span>
                </div>
                <div class="inputbox">
                    <label for="">Salary</label>
                    <input type="number" placeholder="Enter Employee salary.." id="Salary">
                    <span class="error"></span>
                </div>

                <div class="buttons">
                    <button type="submit">Add Employee</button>
                </div>

            </form>
        </div>


    </section>



    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastify-js/1.12.0/toastify.min.js"></script>

    <script src="script/nav.js"></script>
    <script src="script/form.js"></script>
</body>

</html>
