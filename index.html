<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Document</title>
    <link rel="stylesheet" href="style/index.css">
</head>

<body>

    <header>
        <div class="two">
            <h1>Employee Data Management</h1>
        </div>
        <div class="menu">
            <div class="nav">
                <ul>
                    <li><a href="index.html">Add Employee</a></li>
                    <li><a href="table.html">view Table</a></li>
                </ul>
            </div>
            <div class="box">
                <ul class="setting">
                    <li id="darkmode"><i class="fa-solid fa-moon" ></i>darkmode</li>
                </ul>

            </div>
            <div class="box">
                <ul class="setting">
                    <li id="lightmode"><i class="fa-solid fa-moon"  style="color: white;"></i>lightmode</li>
                </ul>

            </div>
            <div class="box icon">
                <i class="fa-solid fa-bell"></i>
            </div>
            <div class="box icon">
                <i class="fa-solid fa-user"></i>
            </div>
        </div>

        <i class="fa-solid fa-bars"></i>
    </header>




    <section>


        <div class="form">
            <form action="">
                <h1 style="text-align: center;">Add Employee</h1>

                <div class="inputbox">
                    <label for="">Employee Name</label>
                    <input type="text" placeholder="Enter name here.." maxlength="20">
                </div>
                <div class="inputbox">
                    <label for="">Employee ID</label>
                    <input type="number" placeholder="">
                </div>
                <div class="inputbox">
                    <label for="">Phone</label>
                    <input type="number" placeholder="">
                </div>
                <div class="inputbox">
                    <select name="" id="">
                        <option value="">designation</option>
                        <option value="">software developer</option>
                        <option value=""> systems analysts</option>
                        <option value="">network engineer</option>
                    </select>
                </div>
                <div class="inputbox">
                    <label for="">Salary</label>
                    <input type="number" placeholder="">
                </div>

                <div class="buttons">
                    <button type="submit">Add Employee</button>
                </div>

            </form>
        </div>


    </section>



    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <script src="script/nav.js"></script>
</body>

</html>
